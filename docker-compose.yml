services:
  dailyreceipt:
    build: .
    # Ou, pour utiliser l'image publiée par GitHub Actions plutôt que de la
    # construire localement (voir README, section TrueNAS) :
    # image: ghcr.io/mathieumarcelino/dailyreceipt:latest
    container_name: dailyreceipt
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      TZ: "Europe/Paris"
      PORT: "3000"
      CONFIG_PATH: "/data/config.json"
    volumes:
      - dailyreceipt-data:/data

volumes:
  dailyreceipt-data:
